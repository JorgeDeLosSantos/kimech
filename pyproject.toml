[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "kimech"
version = "0.2.0"
description = "Planar mechanism kinematics for Python"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Pedro Jorge De Los Santos" },
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.8",
    "pillow>=10",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[project.urls]
Repository = "https://github.com/JorgeDeLosSantos/kimech"
Issues = "https://github.com/JorgeDeLosSantos/kimech/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
