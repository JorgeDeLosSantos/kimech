[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "kimech"
version = "0.6.1"
description = "Planar mechanism kinematics for Python"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Pedro Jorge De Los Santos" },
]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "mechanisms",
    "kinematics",
    "mechanical engineering",
    "robotics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.8",
    "pillow>=10",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]
docs = [
    "sphinx>=8",
    "myst-parser>=4",
    "furo>=2024.8.6",
]

[project.urls]
Documentation = "https://jorgedelossantos.github.io/kimech/"
Repository = "https://github.com/JorgeDeLosSantos/kimech"
Changelog = "https://github.com/JorgeDeLosSantos/kimech/blob/main/CHANGELOG.md"
Issues = "https://github.com/JorgeDeLosSantos/kimech/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
